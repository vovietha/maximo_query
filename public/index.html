<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAXIMO SQL QUERY CONSOLE</title>
    
    <!-- CodeMirror CSS & Theme -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/theme/dracula.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/addon/hint/show-hint.min.css">
    <!-- Stylesheet -->
    <link rel="stylesheet" href="style.css">

    <!-- External Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/sql/sql.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/addon/hint/show-hint.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/addon/hint/sql-hint.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/addon/comment/comment.min.js"></script>

</head>
<body>

    <!-- Header Navbar -->
    <div class="navbar">
        <h1>MAXIMO SQL QUERY CONSOLE</h1>
        <button class="btn-config" id="btn-config" onclick="openConfigModal()">⚙️ Cấu hình kết nối</button>
    </div>

    <!-- Main Console Layout -->
    <div class="container">
        <div class="main-panel">
            <div class="editor-container">
                <textarea id="sqlEditor"></textarea>
            </div>

            <div class="toolbar">
                <div class="action-btns">
                    <button class="btn btn-run" id="btn-execute" onclick="runQuery(1)">Chạy Query (Ctrl+Enter)</button>
                    <button class="btn btn-commit" id="btn-commit" onclick="executeCommand('COMMIT')">Commit</button>
                    <button class="btn btn-rollback" id="btn-rollback" onclick="executeCommand('ROLLBACK')">Rollback</button>
                    <button class="btn btn-toggle" id="btn-toggle-view" onclick="toggleView()">Đổi View (Table/JSON)</button>
                    <input type="text" id="filterInput" class="filter-input" placeholder="🔍 Lọc kết quả real-time..." oninput="renderResults()" />
                </div>
                
                <!-- Thanh Phân Trang & Xuất Excel -->
                <div class="pagination-container">
                    <button class="btn btn-nav" id="btnPrev" onclick="changePage(-1)" disabled>◄ Trước</button>
                    <span id="pageLabel">Trang 1</span>
                    <button class="btn btn-nav" id="btnNext" onclick="changePage(1)" disabled>Sau ►</button>
                    <button class="btn btn-excel" id="btn-export" onclick="exportExcel()">Xuất Excel (.xlsx)</button>
                </div>
            </div>

            <div id="msgBox" class="msg-box"></div>

            <div id="resultsContainer" class="results-container">
                <div id="placeholder-text">Nhập câu lệnh SQL và bấm "Chạy Query" để xem kết quả</div>
            </div>
        </div>

        <!-- Sidebar Lịch sử Query -->
        <div class="sidebar">
            <h3>Lịch sử Query</h3>
            <div id="historyList" class="history-list"></div>
        </div>
    </div>

    <!-- Popup Modal Cấu hình -->
    <div id="configModal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Cấu hình kết nối Maximo</h3>
                <span class="close-btn" onclick="closeConfigModal()">&times;</span>
            </div>
            <div class="form-group">
                <label>Maximo Host (bao gồm Port):</label>
                <input type="text" id="cfgHost" placeholder="VD: http://cmms.pvpgb.vn:9080" />
            </div>
            <div class="form-group">
                <label>Username:</label>
                <input type="text" id="cfgUser" placeholder="VD: maxadmin" />
            </div>
            <div class="form-group">
                <label>Password:</label>
                <input type="password" id="cfgPass" placeholder="Nhập password" />
            </div>
            <button class="btn btn-run" style="width: 100%; margin-top: 10px;" onclick="saveConfig()">Lưu cấu hình</button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
